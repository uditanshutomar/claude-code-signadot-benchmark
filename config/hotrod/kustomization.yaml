apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ctbench-hotrod

resources:
  - ../../work/hotrod/k8s/overlays/prod/devmesh

images:
  - name: signadot/hotrod
    newName: ctbench-hotrod
    newTag: b16178651580

patches:
  - target:
      kind: Deployment
      labelSelector: app=hotrod
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
